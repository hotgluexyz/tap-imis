[tool.poetry]
name = "tap-imis"
version = "0.1.0"
description = "`tap-imis` is a Singer tap for iMIS, built with the Hotglue Singer SDK for Singer Taps."
readme = "README.md"
authors = ["hotglue <hello@hotglue.io>"]
keywords = [
    "ELT",
    "IMIS",
]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = ">=3.7.1,<3.15"
requests = "^2.25.1"
hotglue-singer-sdk = "^1.0.6"

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
tox = "^3.24.4"

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = "tap_imis"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tap-imis = 'tap_imis.tap:TapIMIS.cli'
